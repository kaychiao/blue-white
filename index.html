<script>
        let isHeartMode = false;
        let lastContentKey = ""; // 记录当前文案状态，避免每秒重绘打断按钮点击

        /**
         * 1. 独立的高精度实时时钟引擎（每秒精准对齐系统时间跳动）
         */
        function startRealtimeClock() {
            const clockEl = document.getElementById('liveClock');
            const weekShortEN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
            const pad = n => String(n).padStart(2, '0');

            function tick() {
                const now = new Date();
                const day = weekShortEN[now.getDay()];
                const month = now.getMonth() + 1;
                const date = pad(now.getDate());
                const h = pad(now.getHours());
                const m = pad(now.getMinutes());
                const s = pad(now.getSeconds());

                // 实时显示精确到秒的 macOS 风格时钟
                clockEl.innerText = `${day} · ${month}/${date}  ${h}:${m}:${s}`;

                // 检查是否跨小时或跨天，如果是则平滑更新文案
                const currentKey = `${month}-${date}-${now.getDay()}-${now.getHours()}`;
                if (currentKey !== lastContentKey) {
                    lastContentKey = currentKey;
                    applyTimeContext(now);
                }

                // 对齐系统下一整秒的毫秒差，确保秒针跳动零漂移
                const delay = 1000 - now.getMilliseconds();
                setTimeout(tick, delay);
            }

            tick();
        }

        /**
         * 2. 随真实日期与时段变化的文案引擎
         */
        function applyTimeContext(now = new Date()) {
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = now.getDay(); // 0=周日, 1=周一 ... 6=周六
            const hour = now.getHours();

            const params = new URLSearchParams(window.location.search);
            const isChristmas = (month === 12 && date === 25) || params.get('mode') === 'xmas';

            const weekNamesEN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const weekNamesCN = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];

            document.getElementById('brandTitle').innerText = isChristmas 
                ? "Christmas Edition · Dec 25" 
                : `Daily Brief · ${weekNamesEN[day]}`;

            // 时段问候语（随早中晚深夜实时变化）
            let timeGreeting = "今天也请保持好心情";
            if (hour >= 5 && hour < 12) timeGreeting = "早安，开启清爽的一天";
            else if (hour >= 12 && hour < 14) timeGreeting = "午休间隙，记得好好吃顿午饭";
            else if (hour >= 14 && hour < 18) timeGreeting = "下午茶时间，忙里偷闲放空十秒";
            else if (hour >= 18 && hour < 22) timeGreeting = "傍晚已至，把工作的喧闹关在门外";
            else timeGreeting = "夜深了，早点休息别太熬夜";

            if (isChristmas) {
                isHeartMode = true;
                document.getElementById('heroEyebrow').innerText = "Winter Special · Dec 25";
                document.getElementById('heroTitle').innerHTML = `在今年的圣诞夜，<br>遇见<span>刚刚好</span>的你。`;
                document.getElementById('heroDesc').innerText = `听说冬天的仪式感总让人格外温柔。不擅长太浮夸的表达，所以用我最熟悉的方式，把这一阵子对你的心动留在了这个蓝白页面里。`;
                document.getElementById('heroFooter').innerText = `Merry Christmas · 干净、克制、且让人安心`;

                document.getElementById('card1Title').innerText = "安静且情绪稳定";
                document.getElementById('card1Text').innerText = "跟你聊天总有一种很舒服的松弛感，不用刻意找话题，待在一起就很安心。";
                document.getElementById('card2Title').innerText = "极简的蓝白审美";
                document.getElementById('card2Text').innerText = "就像你喜欢的白色和蓝色一样，简单、通透，却格外耐看。";
                document.getElementById('card3Title').innerText = "反差感的川菜偏好";
                document.getElementById('card3Text').innerText = "平时对零食没什么兴趣，唯独对热辣的川菜情有独钟，这点实在很可爱。";

                document.getElementById('finalTitle').innerText = "圣诞快乐，我很喜欢你。";
                document.getElementById('finalSub').innerText = "没有任何压力，只是想把这份心意坦诚地告诉你。今晚（或这周末）一起去吃顿川菜吗？";
                document.getElementById('ctaBtn').innerText = "好呀，一起去";
                document.getElementById('orbCaption').innerText = "圣诞特别频率 · 轻触光球互动";
                return;
            }

            if (day === 0 || day === 6) {
                document.getElementById('heroEyebrow').innerText = "Weekend Mode";
                document.getElementById('heroTitle').innerHTML = `${weekNamesCN[day]}的阳光很好，<br>适合把时间留给<span>自己</span>。`;
                document.getElementById('heroDesc').innerText = `工作日的方案和数据都可以先暂停一下。顺手写了个安静的蓝白小页面，祝你度过一个彻底松弛的${weekNamesCN[day]}。`;
                document.getElementById('heroFooter').innerText = `Blue & White · ${timeGreeting}`;

                document.getElementById('card1Title').innerText = "消息免打扰";
                document.getElementById('card1Text').innerText = "周末就该把节奏调慢，不用急着回复消息，睡到自然醒才是正经事。";
                document.getElementById('card2Title').innerText = "日常能量补给";
                document.getElementById('card2Text').innerText = "对零食没什么执念也没关系，下午泡杯喜欢的茶或咖啡，晒晒太阳就很惬意。";
                document.getElementById('card3Title').innerText = "周末美食清单";
                document.getElementById('card3Text').innerText = "难得休息，最适合找一家地道川菜馆，用热气腾腾的烟火气犒劳一下自己。";

                document.getElementById('finalTitle').innerText = `祝你${weekNamesCN[day]}愉快，彻底放松。`;
                document.getElementById('finalSub').innerText = `如果周末刚好没安排，随时喊我一起去探店吃川菜？`;
                document.getElementById('ctaBtn').innerText = "已签收 · 周末愉快";
                return;
            }

            const dayFocus = {
                1: {
                    title: `新的一周开始了，<br>用一抹<span>蓝白</span>平稳起飞。`,
                    desc: `周一的待办列表总是格外长，别给自己太大压力，按部就班慢慢来就好。`,
                    c3Title: "周一充能指南",
                    c3Text: "如果第一天工作太消耗精力，晚上最适合用一顿热辣的川菜迅速回血。",
                    fTitle: `周一加油，祝本周一切顺利。`,
                    fSub: `这周哪天忙完了，随时约一顿正宗川菜充充电？`
                },
                5: {
                    title: `终于到了周五，<br>准备迎接<span>松弛</span>的周末。`,
                    desc: `做内容和营销的忙了一整周，今天收好尾，就可以名正言顺地把工作留在公司了。`,
                    c3Title: "周五晚间计划",
                    c3Text: "周五的晚上最有仪式感，最适合约一顿热气腾腾的川菜开启周末。",
                    fTitle: `周五快乐，距离下班又近了一步。`,
                    fSub: `今晚或者周末有空的话，要不要一起去吃顿川菜？`
                }
            };

            const currentDayCopy = dayFocus[day] || {
                title: `${weekNamesCN[day]}的节奏很快，<br>记得留一点<span>蓝白</span>的空白。`,
                desc: `做内容和营销的日常总是被各种数据和方案填满。顺手写了个干净的小页面，忙完手头的事，不妨看一眼呼吸光球放空十秒。`,
                c3Title: "下班后的小期待",
                c3Text: "如果今天工作太消耗精力，晚上最适合用一顿热气腾腾的川菜收尾。",
                fTitle: `${weekNamesCN[day]}加油，祝今天一切顺利。`,
                fSub: `这周哪天忙完了，随时约一顿正宗川菜充充电？`
            };

            document.getElementById('heroEyebrow').innerText = "Workday Edition";
            document.getElementById('heroTitle').innerHTML = currentDayCopy.title;
            document.getElementById('heroDesc').innerText = currentDayCopy.desc;
            document.getElementById('heroFooter').innerText = `Blue & White · ${timeGreeting}`;

            document.getElementById('card1Title').innerText = "今日能量补给";
            document.getElementById('card1Text').innerText = "不爱吃零食也没关系，记得多喝温水，工作间隙离开屏幕远眺一分钟。";
            document.getElementById('card2Title').innerText = "降噪模式开启";
            document.getElementById('card2Text').innerText = "把纷繁的节奏留在屏幕里，保持你一贯的安静与松弛就好。";
            document.getElementById('card3Title').innerText = currentDayCopy.c3Title;
            document.getElementById('card3Text').innerText = currentDayCopy.c3Text;

            document.getElementById('finalTitle').innerText = currentDayCopy.fTitle;
            document.getElementById('finalSub').innerText = currentDayCopy.fSub;
            document.getElementById('ctaBtn').innerText = hour >= 18 ? "收到，准备下班" : "收到，继续搬砖";
        }

        // 启动实时时钟
        startRealtimeClock();

        /**
         * 3. 卡片 3D 微倾视差
         */
        document.querySelectorAll('.tilt-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const rotateX = (((e.clientY - rect.top) - rect.height / 2) / (rect.height / 2)) * -3.5;
                const rotateY = (((e.clientX - rect.left) - rect.width / 2) / (rect.width / 2)) * 3.5;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) translateY(0px)`;
            });
        });

        /**
         * 4. 蓝白液态流体仿真球
         */
        const canvas = document.getElementById('fluidOrb');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const size = 225;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);

        let phase = 0;
        let speedFactor = 1.0;
        let calmBreath = false;

        const orbCard = document.getElementById('orbCard');
        const orbCaption = document.getElementById('orbCaption');

        orbCard.addEventListener('click', () => {
            calmBreath = !calmBreath;
            speedFactor = calmBreath ? 0.55 : 1.0;
            orbCaption.innerText = calmBreath ? "慢节奏呼吸模式 · 吸气 4s / 呼气 4s" : "轻触光球 · 切换深呼吸频率";
        });

        function drawLiquidBlob(radiusBase, amplitude, speed, colorStops, angleOffset) {
            ctx.beginPath();
            const steps = 120;
            const cx = size / 2;
            const cy = size / 2;
            const breathScale = calmBreath ? 1 + Math.sin(phase * 0.7) * 0.14 : 1;

            for (let i = 0; i <= steps; i++) {
                const theta = (i / steps) * Math.PI * 2;
                let r;

                if (isHeartMode) {
                    const heartR = 62 * (1 - 0.28 * Math.sin(theta) + 0.08 * Math.cos(2 * theta));
                    const ripple = Math.sin(theta * 4 + phase * speed) * (amplitude * 0.45);
                    r = (heartR + ripple) * breathScale;
                } else {
                    const w1 = Math.sin(theta * 3 + phase * speed + angleOffset) * amplitude;
                    const w2 = Math.cos(theta * 5 - phase * speed * 1.3) * (amplitude * 0.55);
                    const w3 = Math.sin(theta * 2 + phase * 0.8) * (amplitude * 0.4);
                    r = (radiusBase + w1 + w2 + w3) * breathScale;
                }

                const x = cx + Math.cos(theta) * r;
                const y = cy + Math.sin(theta) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            const grad = ctx.createLinearGradient(30, 30, size - 30, size - 30);
            colorStops.forEach(stop => grad.addColorStop(stop[0], stop[1]));
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function animateOrb() {
            phase += 0.022 * speedFactor;
            ctx.clearRect(0, 0, size, size);

            const glow = ctx.createRadialGradient(size/2, size/2, 20, size/2, size/2, 102);
            glow.addColorStop(0, 'rgba(0, 113, 227, 0.15)');
            glow.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = glow;
            ctx.fillRect(0, 0, size, size);

            ctx.save();
            ctx.globalCompositeOperation = 'multiply';
            drawLiquidBlob(72, 5.5, 1.0, [
                [0, 'rgba(0, 113, 227, 0.72)'],
                [1, 'rgba(90, 200, 250, 0.55)']
            ], 0);
            drawLiquidBlob(70, 6.0, -0.85, [
                [0, 'rgba(56, 189, 248, 0.65)'],
                [1, 'rgba(186, 230, 253, 0.75)']
            ], 2.1);
            ctx.restore();

            ctx.save();
            ctx.globalCompositeOperation = 'screen';
            drawLiquidBlob(58, 3.8, 1.2, [
                [0, 'rgba(255, 255, 255, 0.92)'],
                [0.6, 'rgba(224, 242, 254, 0.45)'],
                [1, 'rgba(255, 255, 255, 0.05)']
            ], 4.2);
            ctx.restore();

            requestAnimationFrame(animateOrb);
        }
        animateOrb();

        /**
         * 5. 底部按钮反馈
         */
        const ctaBtn = document.getElementById('ctaBtn');
        const finalTitle = document.getElementById('finalTitle');
        const finalSub = document.getElementById('finalSub');

        ctaBtn.addEventListener('click', () => {
            ctaBtn.innerText = "已签收 · 随时出发 ✨";
            ctaBtn.classList.add('done');
            finalTitle.innerText = "好嘞，那等你消息！";
            finalSub.innerText = "餐厅交给我来选，你只需要带上好心情就好。";
        });
    </script>
