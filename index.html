<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blue & White — Daily Edition</title>
    <style>
        :root {
            --bg-canvas: #fbfbfd;
            --card-surface: rgba(255, 255, 255, 0.85);
            --text-primary: #1d1d1f;
            --text-secondary: #86868b;
            --apple-blue: #0071e3;
            --apple-blue-hover: #0077ed;
            --ice-tint: #eef6ff;
            --border-hairline: rgba(0, 0, 0, 0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-canvas);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
            overflow-x: hidden;
            user-select: none;
            transition: background-color 0.8s ease;
        }

        /* macOS 风格毛玻璃顶栏 */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 52px;
            background: rgba(251, 251, 253, 0.8);
            backdrop-filter: saturate(180%) blur(20px);
            -webkit-backdrop-filter: saturate(180%) blur(20px);
            border-bottom: 1px solid var(--border-hairline);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 max(24px, 8vw);
            z-index: 100;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .top-bar .brand {
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--apple-blue);
            box-shadow: 0 0 8px rgba(0, 113, 227, 0.45);
        }

        /* Apple Bento Grid 网格 */
        .bento-wrapper {
            width: 100%;
            max-width: 820px;
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 18px;
            perspective: 1200px;
        }

        .bento-card {
            background: var(--card-surface);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.95);
            border-radius: 28px;
            padding: 32px;
            box-shadow: 
                0 4px 24px -4px rgba(0, 0, 0, 0.04),
                0 1px 2px rgba(0, 0, 0, 0.02);
            transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1), box-shadow 0.35s ease;
            position: relative;
            overflow: hidden;
        }

        .bento-card:hover {
            box-shadow: 
                0 20px 40px -12px rgba(0, 113, 227, 0.08),
                0 4px 12px rgba(0, 0, 0, 0.03);
        }

        /* 主视觉卡片 */
        .hero-card {
            grid-column: span 7;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: linear-gradient(145deg, #ffffff 0%, #f2f8ff 100%);
        }

        .eyebrow {
            font-size: 12px;
            font-weight: 600;
            color: var(--apple-blue);
            letter-spacing: 0.6px;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 32px;
            font-weight: 700;
            line-height: 1.22;
            letter-spacing: -0.8px;
            color: var(--text-primary);
        }

        .hero-title span {
            background: linear-gradient(135deg, #0071e3 0%, #4facfe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero-desc {
            font-size: 15px;
            line-height: 1.65;
            color: var(--text-secondary);
            margin-top: 14px;
            max-width: 94%;
        }

        .hero-footer {
            font-size: 13px;
            color: #0071e3;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* 流体蓝白动态仿真球卡片 */
        .orb-card {
            grid-column: span 5;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: #ffffff;
            cursor: pointer;
        }

        #fluidOrb {
            width: 225px;
            height: 225px;
            border-radius: 50%;
        }

        .orb-caption {
            position: absolute;
            bottom: 22px;
            font-size: 12px;
            color: var(--text-secondary);
            letter-spacing: 0.3px;
        }

        /* 三个动态观察小卡片 */
        .detail-card {
            grid-column: span 4;
            padding: 26px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
        }

        .detail-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: var(--ice-tint);
            color: var(--apple-blue);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .detail-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.2px;
        }

        .detail-text {
            font-size: 13.5px;
            line-height: 1.55;
            color: var(--text-secondary);
        }

        /* 底部轻松互动卡片 */
        .action-card {
            grid-column: span 12;
            padding: 26px 34px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            background: linear-gradient(90deg, #ffffff 0%, #f4f9ff 100%);
        }

        .action-text h3 {
            font-size: 17px;
            font-weight: 600;
            letter-spacing: -0.3px;
            margin-bottom: 4px;
        }

        .action-text p {
            font-size: 13.5px;
            color: var(--text-secondary);
        }

        .apple-btn {
            background: var(--apple-blue);
            color: #ffffff;
            border: none;
            padding: 11px 24px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            box-shadow: 0 4px 14px rgba(0, 113, 227, 0.25);
        }

        .apple-btn:hover {
            background: var(--apple-blue-hover);
            transform: scale(1.02);
        }

        .apple-btn:active {
            transform: scale(0.97);
        }

        .apple-btn.done {
            background: #1d1d1f;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.14);
        }

        .reveal {
            opacity: 0;
            transform: translateY(16px) scale(0.985);
            animation: appleReveal 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        .delay-1 { animation-delay: 0.08s; }
        .delay-2 { animation-delay: 0.16s; }
        .delay-3 { animation-delay: 0.24s; }
        .delay-4 { animation-delay: 0.32s; }
        .delay-5 { animation-delay: 0.40s; }

        @keyframes appleReveal {
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 720px) {
            .hero-card, .orb-card, .detail-card, .action-card {
                grid-column: span 12;
            }
            .action-card {
                flex-direction: column;
                align-items: flex-start;
            }
            .hero-title { font-size: 27px; }
        }
    </style>
</head>
<body>

    <nav class="top-bar">
        <div class="brand">
            <span class="status-dot"></span>
            <span id="brandTitle">Daily Brief</span>
        </div>
        <div id="liveClock">Loading...</div>
    </nav>

    <main class="bento-wrapper">
        <section class="bento-card hero-card tilt-card reveal">
            <div>
                <div class="eyebrow" id="heroEyebrow">Workday Edition</div>
                <h1 class="hero-title" id="heroTitle"></h1>
                <p class="hero-desc" id="heroDesc"></p>
            </div>
            <div class="hero-footer">
                <span id="heroFooter">Blue &amp; White · 保持从容，稳步推进</span>
            </div>
        </section>

        <section class="bento-card orb-card tilt-card reveal delay-1" id="orbCard">
            <canvas id="fluidOrb"></canvas>
            <div class="orb-caption" id="orbCaption">轻触光球 · 切换深呼吸频率</div>
        </section>

        <section class="bento-card detail-card tilt-card reveal delay-2">
            <div class="detail-icon">01</div>
            <div>
                <div class="detail-title" id="card1Title"></div>
                <p class="detail-text" id="card1Text"></p>
            </div>
        </section>

        <section class="bento-card detail-card tilt-card reveal delay-3">
            <div class="detail-icon">02</div>
            <div>
                <div class="detail-title" id="card2Title"></div>
                <p class="detail-text" id="card2Text"></p>
            </div>
        </section>

        <section class="bento-card detail-card tilt-card reveal delay-4">
            <div class="detail-icon">03</div>
            <div>
                <div class="detail-title" id="card3Title"></div>
                <p class="detail-text" id="card3Text"></p>
            </div>
        </section>

        <section class="bento-card action-card reveal delay-5">
            <div class="action-text">
                <h3 id="finalTitle"></h3>
                <p id="finalSub"></p>
            </div>
            <button class="apple-btn" id="ctaBtn"></button>
        </section>
    </main>

    <script>
        /**
         * 1. 智能时间感知内容引擎
         * 根据访问时的【星期几】、【几点钟】以及【是否圣诞节】自动切换全部文案与状态
         */
        let isHeartMode = false;

        function applyTimeContext() {
            const now = new Date();
            const month = now.getMonth() + 1;
            const date = now.getDate();
            const day = now.getDay(); // 0=周日, 1=周一 ... 6=周六
            const hour = now.getHours();

            // 支持通过 URL 参数 ?mode=xmas 提前预览圣诞彩蛋效果
            const params = new URLSearchParams(window.location.search);
            const isChristmas = (month === 12 && date === 25) || params.get('mode') === 'xmas';

            const weekNamesEN = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const weekNamesCN = ["周日", "周一", "周二", "周三", "周四", "周五", "周六"];
            const weekShortEN = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];

            // 更新顶栏
            const pad = n => String(n).padStart(2, '0');
            document.getElementById('brandTitle').innerText = isChristmas 
                ? "Christmas Edition · Dec 25" 
                : `Daily Brief · ${weekNamesEN[day]}`;
            document.getElementById('liveClock').innerText = 
                `${weekShortEN[day]} · ${month}/${pad(date)} ${pad(hour)}:${pad(now.getMinutes())}`;

            // 时段问候语
            let timeGreeting = "今天也请保持好心情";
            if (hour >= 5 && hour < 12) timeGreeting = "早安，开启清爽的一天";
            else if (hour >= 12 && hour < 14) timeGreeting = "午休间隙，记得好好吃顿午饭";
            else if (hour >= 14 && hour < 18) timeGreeting = "下午茶时间，忙里偷闲放空十秒";
            else if (hour >= 18 && hour < 22) timeGreeting = "傍晚已至，把工作的喧闹关在门外";
            else timeGreeting = "夜深了，早点休息别太熬夜";

            // 特殊节日彩蛋：12月25日圣诞节自动触发
            if (isChristmas) {
                isHeartMode = true;
                document.getElementById('heroEyebrow').innerText = "Winter Special · Dec 25";
                document.getElementById('heroTitle').innerHTML = `在今年的圣诞夜，<br>遇见<span>刚刚好</span>的你。`;
                document.getElementById('heroDesc').innerText = `听说冬天的仪式感总让人格外温柔。不擅长太浮夸的表达，所以用我最熟悉的方式，把这一阵子对你的心动留在了这个蓝白页面里。`;
                document.getElementById('heroFooter').innerText = `Merry Christmas · 干净、克制、且让人安心`;

                document.getElementById('card1Title').innerText = "安静且情绪稳定";
                document.getElementById('card1Text').innerText = "跟你聊天总有一种很舒服的松弛感，不用刻意找话题，待在一起就很安心。";
                document.getElementById('card2Title').innerText = "极简的蓝白审美";
                document.getElementById('card2Text').innerText = "就像你喜欢的白色和蓝色一样，简单、通透，却格外耐看。";
                document.getElementById('card3Title').innerText = "反差感的川菜偏好";
                document.getElementById('card3Text').innerText = "平时对零食没什么兴趣，唯独对热辣的川菜情有独钟，这点实在很可爱。";

                document.getElementById('finalTitle').innerText = "圣诞快乐，我很喜欢你。";
                document.getElementById('finalSub').innerText = "没有任何压力，只是想把这份心意坦诚地告诉你。今晚（或这周末）一起去吃顿川菜吗？";
                document.getElementById('ctaBtn').innerText = "好呀，一起去";
                document.getElementById('orbCaption').innerText = "圣诞特别频率 · 轻触光球互动";
                return;
            }

            // 周末模式（周六、周日）
            if (day === 0 || day === 6) {
                document.getElementById('heroEyebrow').innerText = "Weekend Mode";
                document.getElementById('heroTitle').innerHTML = `${weekNamesCN[day]}的阳光很好，<br>适合把时间留给<span>自己</span>。`;
                document.getElementById('heroDesc').innerText = `工作日的方案和数据都可以先暂停一下。顺手写了个安静的蓝白小页面，祝你度过一个彻底松弛的${weekNamesCN[day]}。`;
                document.getElementById('heroFooter').innerText = `Blue & White · ${timeGreeting}`;

                document.getElementById('card1Title').innerText = "消息免打扰";
                document.getElementById('card1Text').innerText = "周末就该把节奏调慢，不用急着回复消息，睡到自然醒才是正经事。";
                document.getElementById('card2Title').innerText = "日常能量补给";
                document.getElementById('card2Text').innerText = "对零食没什么执念也没关系，下午泡杯喜欢的茶或咖啡，晒晒太阳就很惬意。";
                document.getElementById('card3Title').innerText = "周末美食清单";
                document.getElementById('card3Text').innerText = "难得休息，最适合找一家地道川菜馆，用热气腾腾的烟火气犒劳一下自己。";

                document.getElementById('finalTitle').innerText = `祝你${weekNamesCN[day]}愉快，彻底放松。`;
                document.getElementById('finalSub').innerText = `如果周末刚好没安排，随时喊我一起去探店吃川菜？`;
                document.getElementById('ctaBtn').innerText = "已签收 · 周末愉快";
                return;
            }

            // 工作日模式（周一至周五动态细分）
            const dayFocus = {
                1: {
                    title: `新的一周开始了，<br>用一抹<span>蓝白</span>平稳起飞。`,
                    desc: `周一的待办列表总是格外长，别给自己太大压力，按部就班慢慢来就好。`,
                    c3Title: "周一充能指南",
                    c3Text: "如果第一天工作太消耗精力，晚上最适合用一顿热辣的川菜迅速回血。",
                    fTitle: `周一加油，祝本周一切顺利。`,
                    fSub: `这周哪天忙完了，随时约一顿正宗川菜充充电？`
                },
                5: {
                    title: `终于到了周五，<br>准备迎接<span>松弛</span>的周末。`,
                    desc: `做内容和营销的忙了一整周，今天收好尾，就可以名正言顺地把工作留在公司了。`,
                    c3Title: "周五晚间计划",
                    c3Text: "周五的晚上最有仪式感，最适合约一顿热气腾腾的川菜开启周末。",
                    fTitle: `周五快乐，距离下班又近了一步。`,
                    fSub: `今晚或者周末有空的话，要不要一起去吃顿川菜？`
                }
            };

            const currentDayCopy = dayFocus[day] || {
                title: `${weekNamesCN[day]}的节奏很快，<br>记得留一点<span>蓝白</span>的空白。`,
                desc: `做内容和营销的日常总是被各种数据和方案填满。顺手写了个干净的小页面，忙完手头的事，不妨看一眼呼吸光球放空十秒。`,
                c3Title: "下班后的小期待",
                c3Text: "如果今天工作太消耗精力，晚上最适合用一顿热气腾腾的川菜收尾。",
                fTitle: `${weekNamesCN[day]}加油，祝今天一切顺利。`,
                fSub: `这周哪天忙完了，随时约一顿正宗川菜充充电？`
            };

            document.getElementById('heroEyebrow').innerText = "Workday Edition";
            document.getElementById('heroTitle').innerHTML = currentDayCopy.title;
            document.getElementById('heroDesc').innerText = currentDayCopy.desc;
            document.getElementById('heroFooter').innerText = `Blue & White · ${timeGreeting}`;

            document.getElementById('card1Title').innerText = "今日能量补给";
            document.getElementById('card1Text').innerText = "不爱吃零食也没关系，记得多喝温水，工作间隙离开屏幕远眺一分钟。";
            document.getElementById('card2Title').innerText = "降噪模式开启";
            document.getElementById('card2Text').innerText = "把纷繁的节奏留在屏幕里，保持你一贯的安静与松弛就好。";
            document.getElementById('card3Title').innerText = currentDayCopy.c3Title;
            document.getElementById('card3Text').innerText = currentDayCopy.c3Text;

            document.getElementById('finalTitle').innerText = currentDayCopy.fTitle;
            document.getElementById('finalSub').innerText = currentDayCopy.fSub;
            document.getElementById('ctaBtn').innerText = hour >= 18 ? "收到，准备下班" : "收到，继续搬砖";
        }

        applyTimeContext();
        // 每分钟自动刷新时间与时段状态
        setInterval(applyTimeContext, 60000);

        /**
         * 2. 卡片 3D 微倾视差
         */
        document.querySelectorAll('.tilt-card').forEach(card => {
            card.addEventListener('mousemove', e => {
                const rect = card.getBoundingClientRect();
                const rotateX = (((e.clientY - rect.top) - rect.height / 2) / (rect.height / 2)) * -3.5;
                const rotateY = (((e.clientX - rect.left) - rect.width / 2) / (rect.width / 2)) * 3.5;
                card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(-2px)`;
            });
            card.addEventListener('mouseleave', () => {
                card.style.transform = `rotateX(0deg) rotateY(0deg) translateY(0px)`;
            });
        });

        /**
         * 3. 蓝白液态流体仿真球
         */
        const canvas = document.getElementById('fluidOrb');
        const ctx = canvas.getContext('2d');
        const dpr = window.devicePixelRatio || 1;
        const size = 225;
        canvas.width = size * dpr;
        canvas.height = size * dpr;
        ctx.scale(dpr, dpr);

        let phase = 0;
        let speedFactor = 1.0;
        let calmBreath = false;

        const orbCard = document.getElementById('orbCard');
        const orbCaption = document.getElementById('orbCaption');

        orbCard.addEventListener('click', () => {
            calmBreath = !calmBreath;
            speedFactor = calmBreath ? 0.55 : 1.0;
            orbCaption.innerText = calmBreath ? "慢节奏呼吸模式 · 吸气 4s / 呼气 4s" : "轻触光球 · 切换深呼吸频率";
        });

        function drawLiquidBlob(radiusBase, amplitude, speed, colorStops, angleOffset) {
            ctx.beginPath();
            const steps = 120;
            const cx = size / 2;
            const cy = size / 2;
            const breathScale = calmBreath ? 1 + Math.sin(phase * 0.7) * 0.14 : 1;

            for (let i = 0; i <= steps; i++) {
                const theta = (i / steps) * Math.PI * 2;
                let r;

                if (isHeartMode) {
                    const heartR = 62 * (1 - 0.28 * Math.sin(theta) + 0.08 * Math.cos(2 * theta));
                    const ripple = Math.sin(theta * 4 + phase * speed) * (amplitude * 0.45);
                    r = (heartR + ripple) * breathScale;
                } else {
                    const w1 = Math.sin(theta * 3 + phase * speed + angleOffset) * amplitude;
                    const w2 = Math.cos(theta * 5 - phase * speed * 1.3) * (amplitude * 0.55);
                    const w3 = Math.sin(theta * 2 + phase * 0.8) * (amplitude * 0.4);
                    r = (radiusBase + w1 + w2 + w3) * breathScale;
                }

                const x = cx + Math.cos(theta) * r;
                const y = cy + Math.sin(theta) * r;
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.closePath();

            const grad = ctx.createLinearGradient(30, 30, size - 30, size - 30);
            colorStops.forEach(stop => grad.addColorStop(stop[0], stop[1]));
            ctx.fillStyle = grad;
            ctx.fill();
        }

        function animateOrb() {
            phase += 0.022 * speedFactor;
            ctx.clearRect(0
