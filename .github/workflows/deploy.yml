name: Deploy Static Site to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "17 23 * * *" # 北京时间约 07:17，GitHub 定时任务可能延迟
    - cron: "37 * * * *" # 每小时更新天气，不调用 Gemini
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify copy timing and content rules
        run: node --test tests/season-scenes.test.cjs tests/copy-generation.test.mjs
      - name: Restore last valid AI batch
        uses: actions/cache/restore@v4
        with:
          path: .cache/generated-copy.json
          key: ai-copy-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ai-copy-
      - name: Generate daily Gemini copy
        env:
          GEMINI_API_KEY: ${{ github.event.schedule != '37 * * * *' && secrets.GEMINI_API_KEY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          FRED_PROFILE: ${{ secrets.FRED_PROFILE }}
          FRED_RECENT: ${{ secrets.FRED_RECENT }}
        run: node scripts/generate-copy.mjs
      - name: Save AI batch
        uses: actions/cache/save@v4
        with:
          path: .cache/generated-copy.json
          key: ai-copy-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore recent weather snapshot
        uses: actions/cache/restore@v4
        with:
          path: .cache/weather.json
          key: weather-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: weather-
      - name: Fetch Shanghai weather
        env:
          QWEATHER_API_KEY: ${{ secrets.QWEATHER_API_KEY }}
          QWEATHER_API_HOST: ${{ secrets.QWEATHER_API_HOST }}
        run: node scripts/fetch-weather.mjs
      - name: Save weather snapshot
        uses: actions/cache/save@v4
        with:
          path: .cache/weather.json
          key: weather-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Configure browser restaurant search
        env:
          AMAP_JS_KEY: ${{ secrets.AMAP_JS_KEY }}
          AMAP_JS_SECURITY_CODE: ${{ secrets.AMAP_JS_SECURITY_CODE }}
        run: node scripts/build-amap-config.mjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html copy-title.js daily-copy.js generated-copy.js weather.js weather-data.js longing.js amap-config.js restaurants.js page-refresh.js holiday-config.js holidays.js scenes.js _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: _site

  deploy:
    needs: build
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
